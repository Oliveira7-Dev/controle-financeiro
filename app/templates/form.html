{% extends "base.html" %}

{% block title %}{{ titulo }} | Controle Financeiro{% endblock %}

{% block content %}
<section class="form-page">
    <div class="form-card">
        <span class="eyebrow">Movimentação financeira</span>
        <h1>{{ titulo }}</h1>

        <form method="post" class="form-grid">
            <label>
                Descrição
                <input
                    type="text"
                    name="descricao"
                    maxlength="120"
                    required
                    value="{{ dados.get('descricao', '') }}"
                    placeholder="Ex.: Salário, aluguel, supermercado">
            </label>

            <div class="two-columns">
                <label>
                    Valor
                    <input
                        type="number"
                        step="0.01"
                        min="0.01"
                        name="valor"
                        required
                        value="{{ dados.get('valor', '') }}"
                        placeholder="0,00">
                </label>

                <label>
                    Data
                    <input
                        type="date"
                        name="data"
                        required
                        value="{{ dados.get('data', '') }}">
                </label>
            </div>

            <div class="two-columns">
                <label>
                    Tipo
                    <select name="tipo" required>
                        <option value="">Selecione</option>
                        <option value="receita" {% if dados.get('tipo') == 'receita' %}selected{% endif %}>
                            Receita
                        </option>
                        <option value="despesa" {% if dados.get('tipo') == 'despesa' %}selected{% endif %}>
                            Despesa
                        </option>
                    </select>
                </label>

                <label>
                    Categoria
                    <input
                        type="text"
                        name="categoria"
                        maxlength="60"
                        required
                        value="{{ dados.get('categoria', '') }}"
                        placeholder="Ex.: Alimentação">
                </label>
            </div>

            <div class="form-actions">
                <a class="button secondary" href="{{ url_for('financeiro.index') }}">Cancelar</a>
                <button class="button primary" type="submit">Salvar lançamento</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
